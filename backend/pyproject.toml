[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplygraph"
version = "0.2.0"
description = "Supply-chain risk agent that reasons over a FalkorDB knowledge graph."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "falkordb==1.8.0",
    "openai==3.31.0",
    "mcp==2.3.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "pypdf==6.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
supplygraph = "supplygraph.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supplygraph*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires a reachable FalkorDB instance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
